name: Deploy AWS Lambda

on:
  push:
    branches: [ v2-LLM-model ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up Node.js for Serverless Framework
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Install Serverless Framework CLI
      - name: Install Serverless Framework v3
        run: npm install -g serverless@3

      # Install the python-requirements plugin
      - name: Install serverless-python-requirements plugin
        run: npm install -g serverless-python-requirements

      # Configure AWS credentials from GitHub secrets
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      # Set up Python (used by serverless-python-requirements during packaging)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Install project Python dependencies (for local packaging only)
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-app.txt
          pip install -r backend/requirements-layer.txt

      # Deploy with custom deploy script
      - name: Make deploy script executable
        run: chmod +x backend/deploy.sh

      - name: Deploy via deploy.sh
        run: backend/deploy.sh
        env:
          # Pass any additional environment variables required for serverless
          SLS_DEBUG: '*'
          SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}
          SLS_TELEMETRY_DISABLED: 1
