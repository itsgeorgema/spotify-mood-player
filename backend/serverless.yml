service: spotify-mood-player-${env:DEPLOY_TIMESTAMP, '1'}

provider:
  name: aws
  runtime: python3.12
  stage: ${opt:stage, 'prod'}
  region: ${opt:region, 'us-east-2'}
  environment:
    FLASK_ENV: production
    FLASK_DEBUG: true
    LOG_LEVEL: DEBUG
    FLASK_SECRET_KEY: ${ssm:/spotify-mood-player/prod/FLASK_SECRET_KEY}
    SPOTIPY_CLIENT_ID: ${ssm:/spotify-mood-player/prod/SPOTIPY_CLIENT_ID}
    SPOTIPY_CLIENT_SECRET: ${ssm:/spotify-mood-player/prod/SPOTIPY_CLIENT_SECRET}
    SPOTIPY_REDIRECT_URI: ${ssm:/spotify-mood-player/prod/SPOTIPY_REDIRECT_URI}
    GENIUS_ACCESS_TOKEN: ${ssm:/spotify-mood-player/prod/GENIUS_ACCESS_TOKEN}
    OPENAI_API_KEY: ${ssm:/spotify-mood-player/prod/OPENAI_API_KEY}
    FRONTEND_URL: ${ssm:/spotify-mood-player/prod/FRONTEND_URL}
    SUPABASE_DATABASE_URL: ${ssm:/spotify-mood-player/prod/SUPABASE_DATABASE_URL}
  timeout: 29 # Match API Gateway max timeout
  memorySize: 1024 # 1GB of memory
  apiGateway:
    minimumCompressionSize: 1024
    shouldStartNameWithService: true
  logs:
    restApi: true # Enable API Gateway logs

plugins:
  - serverless-python-requirements
  - serverless-plugin-include-dependencies

custom:
  pythonRequirements:
    dockerizePip: true
    dockerRunArgs: ["--platform", "linux/amd64"]
    dockerExtraArgs: ["--platform", "linux/amd64"]
    useDownloadCache: false
    useStaticCache: false
    pip:
      command: pip3
    slim: true
    slimPatterns:
      - "**/*.pyc"
      - "**/__pycache__/**"
      - "**/*.dist-info/**"
      - "**/*.egg-info/**"
      - "**/tests/**"
      - "**/test/**"
      - "**/*.md"
      - "**/*.txt"
      - "**/*.rst"
      - "**/docs/**"
      - "**/examples/**"
      - "**/benchmarks/**"
    strip: true
    fileName: requirements-app.txt
    noDeploy:
      - numpy
      - scipy
      - librosa
      - pydub
      - soundfile
      - audioread
      - numba
      - llvmlite
      - pytest
      - matplotlib
      - pandas

package:
  individually: false
  patterns:
    - "!.venv/**"
    - "!venv/**"
    - "!__pycache__/**"
    - "!.pytest_cache/**"
    - "!tests/**"
    - "!.git/**"
    - "!node_modules/**"
    - "!*.pyc"
    - "!**/*.pyc"
    - "!.DS_Store"
    - "!.cache/**"
    - "!.serverless/**"
    - "!.package/**"
    - "!requirements.txt"
    - "!requirements-layer.txt"
    - "!apt-commands.txt"
    - "!layer.yml"
    - "!training_data.csv"
    - "!deploy.sh"
    - "!Dockerfile"
    - "!gunicorn.conf.py"
    - "!postgres-init.sql"

functions:
  app:
    handler: lambda_function.lambda_handler
    timeout: 29 # Match API Gateway max timeout
    memorySize: 1024 # 1GB of memory
    layers:
      - ${cf:spotify-mood-player-layer-${env:DEPLOY_TIMESTAMP, '1'}-${self:provider.stage}.SpotifyMoodPlayerLayerExport}
    events:
      - http:
          path: /
          method: ANY
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
            allowCredentials: true
      - http:
          path: /{proxy+}
          method: ANY
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
            allowCredentials: true 